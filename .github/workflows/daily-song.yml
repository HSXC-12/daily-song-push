name: daily-song

on:
  schedule:
    - cron: '0 4 * * *'   # UTC 04:00 = 北京时间 12:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
        working-directory: daily-song-push
      - name: Generate & send
        run: node recommend.mjs
        working-directory: daily-song-push
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-song-push/history.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "chore: update history [skip ci]" && git push; fi
